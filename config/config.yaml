# Base (profile-independent) configuration.
# Per-role model providers live in config/profiles/<name>.yaml and are
# selected by MODEL_PROFILE (see .env).

ingestion:
  asr_window_seconds: 30       # window size for ASR passes
  asr_timeout_seconds: 1800    # HTTP timeout for the whole-video ASR batch (long videos) — #30
  # Omni scene segmentation windows (overlap + reconcile).
  omni_window_seconds: 90
  omni_overlap_seconds: 15
  max_segment_seconds: 30      # cap shot length; longer segments split into equal pieces (<=0 disables) — #60

labelling:
  # Shot-window sequential processing.
  window_size: 5            # shots visible per step
  window_stride: 3          # shots committed per step (overlap = size - stride)
  carry_over: rolling_summary

retrieval:
  # Hybrid = pgvector (dense) + BM25 (lexical).
  hybrid_alpha: 0.5         # weight of dense vs lexical
  precedent_top_k: 5        # find_similar_segments neighbours

policy:
  max_depth: 3              # Root -> {Rubric, Attribute, Edge}
  categories: [gambling, bad_language, sex]
  score_min: 0
  score_max: 5

consistency:
  cross_sample_entropy_warn: 0.8
  reproducibility_runs: 3
