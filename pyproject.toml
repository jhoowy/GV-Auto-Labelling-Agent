[project]
name = "video-labelling-iji"
version = "0.1.0"
description = "Agentic Auto-Labelling system for gameplay video content moderation (PoC)"
requires-python = ">=3.11"
dependencies = [
    # Agent / orchestration
    "langchain>=0.3",
    "langgraph>=0.2",
    "langfuse>=3",  # opt-in tracing (no-op unless LANGFUSE_* env is set)
    # Backend
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    # Storage: Postgres + pgvector + BM25
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "pgvector>=0.3",
    # Config
    "pyyaml>=6.0",
    # Ingestion helpers (video acquisition documented via yt-dlp only)
    "yt-dlp>=2024.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5", "mypy>=1.10"]
# Local vLLM model serving (GPU, single-node ingestion). Not needed when using
# proprietary API providers. Install with: pip install -e ".[serving]"
# FlashAttention is installed separately from an env-specific prebuilt wheel
# (see README) — intentionally not pinned here.
serving = ["vllm[audio]>=0.26"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# Monorepo: flat imports (import schemas, tools, models, ingestion, labelling,
# policy, backend, db). Explicit package-dir mapping avoids the finder confusing
# a source dir whose name matches its package (e.g. ingestion/ingestion).
[tool.setuptools]
packages = ["schemas", "tools", "models", "ingestion", "labelling", "policy", "backend", "db"]

[tool.setuptools.package-dir]
schemas = "packages/schemas/schemas"
tools = "packages/tools/tools"
models = "packages/models/models"
ingestion = "ingestion/ingestion"
labelling = "labelling/labelling"
policy = "policy/policy"
backend = "app/backend/backend"
db = "db/db"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
