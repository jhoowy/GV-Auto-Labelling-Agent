[alembic]
script_location = db/alembic
prepend_sys_path = .
# DATABASE_URL is read from env in alembic/env.py (sqlalchemy.url left blank).
sqlalchemy.url =

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
