# PoC infra: Postgres (with pgvector) is the single Data Warehouse
# (relational + vector + BM25/full-text). MinIO is optional; the default
# blob backend is the local filesystem (see config/config.yaml).
services:
  postgres:
    # pgvector image ships the `vector` extension; BM25/full-text via tsvector.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: vlabel
      POSTGRES_PASSWORD: vlabel
      POSTGRES_DB: vlabel
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # Optional object storage. Disabled by default; enable with:
  #   docker compose --profile blob up
  minio:
    image: minio/minio
    profiles: ["blob"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata:
